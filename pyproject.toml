[project]
name = "agentic-support-framework"
version = "1.0.0"
description = "Production-grade agentic monitoring, RCA, and remediation framework"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
